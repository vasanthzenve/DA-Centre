version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. NGINX LOAD BALANCER
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: da_centre_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    networks:
      - da_network

  # ----------------------------------------------------------------------------
  # 2. SPRING BOOT BACKEND INSTANCE #1
  # ----------------------------------------------------------------------------
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: da_backend_1
    restart: always
    environment:
      - SERVER_PORT=8080
      - INSTANCE_ID=backend-1
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=Vasanth@zenve
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HIKARI_MAX_POOL_SIZE=25
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - da_network

  # ----------------------------------------------------------------------------
  # 3. SPRING BOOT BACKEND INSTANCE #2
  # ----------------------------------------------------------------------------
  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: da_backend_2
    restart: always
    environment:
      - SERVER_PORT=8081
      - INSTANCE_ID=backend-2
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=Vasanth@zenve
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HIKARI_MAX_POOL_SIZE=25
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - da_network

  # ----------------------------------------------------------------------------
  # 4. SPRING BOOT BACKEND INSTANCE #3
  # ----------------------------------------------------------------------------
  backend-3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: da_backend_3
    restart: always
    environment:
      - SERVER_PORT=8082
      - INSTANCE_ID=backend-3
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=Vasanth@zenve
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HIKARI_MAX_POOL_SIZE=25
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - da_network

  # ----------------------------------------------------------------------------
  # 5. REDIS DISTRIBUTED CACHE & ASYNC STATE STORE
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: da_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - da_network

  # ----------------------------------------------------------------------------
  # 6. MYSQL 8.0 (TUNED FOR 15 MILLION RECORDS)
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: da_mysql
    restart: always
    environment:
      - MYSQL_DATABASE=veterinary_research
      - MYSQL_ROOT_PASSWORD=Vasanth@zenve
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema-optimization.sql:/docker-entrypoint-initdb.d/schema-optimization.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=4G
      --innodb-log-file-size=512M
      --innodb-flush-log-at-trx-commit=2
      --innodb-flush-method=O_DIRECT
      --max-connections=300
      --table-open-cache=4000
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pVasanth@zenve"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - da_network

networks:
  da_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
