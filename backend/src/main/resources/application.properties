    spring.application.name=veterinary-research
server.port=${SERVER_PORT:8080}
server.instance.id=${INSTANCE_ID:backend-1}

# ==============================================================================
# DATABASE CONFIGURATION (MySQL with 15M Record Optimization)
# ==============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/veterinary_research?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&useLocalSessionState=true&maintainTimeStats=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Vasanth@zenve}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Tuning for 15M Records & Multi-Instance Clusters
spring.datasource.hikari.pool-name=HikariCP-15M-Pool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:25}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:10}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.auto-commit=true

# ==============================================================================
# JPA / HIBERNATE PERFORMANCE TUNING
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Spring Data Web Pageable Settings
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=2000

# High-Performance Batch Insert / Update Settings
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.jdbc.fetch_size=200

# ==============================================================================
# REDIS DISTRIBUTED CACHE & STATE STORE
# ==============================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=1000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# ==============================================================================
# ASYNC & THREAD POOL CONFIGURATION FOR STREAMING IMPORT/EXPORT
# ==============================================================================
app.async.core-pool-size=8
app.async.max-pool-size=32
app.async.queue-capacity=500
app.async.thread-name-prefix=Async15MWorker-

# File Staging Directory for Streaming Imports/Exports
app.storage.temp-dir=${TEMP_DIR:./data/temp}

# ==============================================================================
# MULTIPART FILE UPLOAD (Support up to 100MB Excel/CSV Files)
# ==============================================================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ==============================================================================
# ACTUATOR & PROMETHEUS METRICS MONITORING
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.enable.hikaricp=true
management.metrics.enable.jvm=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ==============================================================================
# JWT CONFIGURATION
# ==============================================================================
app.jwt.secret=9a3f2c4e6b8a1d5e7f9c2b4a6d8e0f1a3c5e7b9d1f3a5c7e9b1d3f5a7c9e1b3d
app.jwt.expiration-ms=86400000

# ==============================================================================
# LOGGING
# ==============================================================================
logging.level.com.veterinary.research=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN